<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidal Frontier 3D</title><style>body{margin:0;overflow:hidden;background:#8ccddd;font:14px system-ui;color:white}canvas{display:block}#hud,#clan{position:absolute;background:#082331dc;border:1px solid #5cc9c8;border-radius:14px;padding:14px;backdrop-filter:blur(8px)}#hud{top:15px;left:15px;max-width:280px}#clan{right:15px;top:15px;width:245px;max-height:80vh;overflow:auto;display:none}button,input,select{padding:9px;margin:4px 2px;border-radius:7px;border:1px solid #5cc9c8;background:#123d50;color:white}button{cursor:pointer;background:#147d88}button:hover{background:#229ba3}input{width:90%;box-sizing:border-box}h2{margin:0 0 8px;font-size:19px}small{color:#b8dce3}#tip{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#082331dc;border-radius:9px;padding:10px;text-align:center;pointer-events:none}#mobile{position:absolute;bottom:70px;left:10px;display:none}#mobile button{font-size:24px}#toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#07242de9;border-radius:10px;padding:12px;display:none}@media(pointer:coarse){#mobile{display:block}#hud{font-size:12px;max-width:220px}#clan{width:210px}}</style></head><body><div id="hud"><h2>🌊 TIDAL FRONTIER 3D</h2><div id="status">Loading world...</div><button id="fish">🎣 Cast / Reel (F)</button><button id="boat">🚤 Boat (B)</button><button id="clans">🛡 Clans</button><button id="quality">⚙ Performance</button><div><small>WASD move · Mouse drag rotate · Shift sprint · F fish · B boat</small></div></div><div id="clan"><button id="close" style="float:right">✕</button><h2>🛡 Clans</h2><div id="clanstatus"></div><div id="clanactions"><input id="clanname" placeholder="New clan name"><input id="clantag" placeholder="Clan tag (2–5)"><button id="create">Create clan</button><input id="jointag" placeholder="Tag to join"><button id="join">Join clan</button><button id="leave">Leave clan</button></div><h3>Clan leaderboard</h3><div id="clanlist"></div><small>Log in on the original 2D game first. Clans are saved on this server.</small></div><div id="tip">Explore the island, walk to the shore, and press F to cast!</div><div id="toast"></div><div id="mobile"><button data-k="w">▲</button><br><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd6eb);scene.fog=new THREE.FogExp2(0x9bd6eb,.0034);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1500);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8f7ff,0x47724d,2.2));const sun=new THREE.DirectionalLight(0xfff3d6,2.7);sun.position.set(-90,130,80);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-180;sun.shadow.camera.right=180;sun.shadow.camera.top=180;sun.shadow.camera.bottom=-180;scene.add(sun);
const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const sand=mat(0xf1d4a0),grass=mat(0x3e8d53),wood=mat(0x79543a),leaf=mat(0x237d45),rock=mat(0x777d7a),white=mat(0xf5f4e7),blue=mat(0x1467a1,.35);function mesh(g,m,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}function box(w,h,d,m,x,y,z){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z)}
const water=mesh(new THREE.PlaneGeometry(2200,2200,70,70),new THREE.MeshPhysicalMaterial({color:0x169cb3,roughness:.22,metalness:.1,transparent:true,opacity:.88,clearcoat:.7}),0,0,0);water.rotation.x=-Math.PI/2;const waterPos=water.geometry.attributes.position;const original=new Float32Array(waterPos.array);
const island=mesh(new THREE.CylinderGeometry(93,103,8,96),sand,0,-2,0);const top=mesh(new THREE.CylinderGeometry(74,91,2.2,96),grass,0,2.4,0);function terrainY(x,z){const r=Math.hypot(x,z);return r<72?3.6:r<92?2:0}function palm(x,z,s=1){const y=terrainY(x,z);const trunk=mesh(new THREE.CylinderGeometry(.5*s,.9*s,13*s,9),wood,x,y+6.5*s,z);trunk.rotation.z=(Math.sin(x*2+z)*.13);const crown=new THREE.Group();crown.position.set(x,y+13*s,z);scene.add(crown);for(let i=0;i<8;i++){const a=i*Math.PI/4;const frond=new THREE.Mesh(new THREE.SphereGeometry(1,6,4),leaf);frond.scale.set(7*s,.23*s,1.3*s);frond.position.set(Math.cos(a)*3.8*s,-.8*s,Math.sin(a)*3.8*s);frond.rotation.y=-a;crown.add(frond)}mesh(new THREE.SphereGeometry(1.1*s,8,8),leaf,x,y+13*s,z)}for(let i=0;i<42;i++){let a=i*2.399,r=20+Math.sqrt((i*47)%100)/10*5;let x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(z)<17&&x>0)continue;palm(x,z,.7+(i%5)*.12)}for(let i=0;i<42;i++){const a=i*2.4,r=60+(i*13)%28;mesh(new THREE.DodecahedronGeometry(.7+(i%4)*.45,0),rock,Math.cos(a)*r,terrainY(Math.cos(a)*r,Math.sin(a)*r)+.5,Math.sin(a)*r)}
// Pier, moored boat, and small fishing hut
for(let z=12;z<130;z+=7){box(12,.7,6,wood,72,3,z);if(z%14===12){box(.8,6,.8,wood,66,0,z);box(.8,6,.8,wood,78,0,z)}}box(15,9,12,mat(0xc4a26c),52,8,35);const roof=mesh(new THREE.ConeGeometry(12,7,4),mat(0x814735),52,16,35);roof.rotation.y=Math.PI/4;box(3,5,.3,mat(0x422e21),52,6,41.1);
const boatGroup=new THREE.Group();scene.add(boatGroup);boatGroup.position.set(90,1,105);const hull=new THREE.Mesh(new THREE.CylinderGeometry(3,2.1,14,8),mat(0xffffff,.45));hull.rotation.x=Math.PI/2;hull.scale.set(1.6,1,.6);boatGroup.add(hull);const cabin=new THREE.Mesh(new THREE.BoxGeometry(5,3,5),white);cabin.position.y=2.5;boatGroup.add(cabin);const windshield=new THREE.Mesh(new THREE.BoxGeometry(4.5,1.6,.15),blue);windshield.position.set(0,3,2.6);boatGroup.add(windshield);
const person=new THREE.Group();scene.add(person);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(1.2,2.5,4,8),mat(0x1a6d89));torso.position.y=4;person.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),mat(0xe4b18b));head.position.y=6.5;person.add(head);for(let x of [-.65,.65]){let leg=new THREE.Mesh(new THREE.CylinderGeometry(.35,.43,2.6,8),mat(0x26384d));leg.position.set(x,1.5,0);person.add(leg)}const rod=new THREE.Group();person.add(rod);rod.position.set(1.4,4.4,.1);const stick=new THREE.Mesh(new THREE.CylinderGeometry(.045,.09,9,6),mat(0x232c33));stick.position.set(0,4,0);stick.rotation.z=-.22;rod.add(stick);
const fishShapes=[];for(let i=0;i<38;i++){let a=i*2.4,r=102+(i*31)%200;const f=new THREE.Group();f.position.set(Math.cos(a)*r,-1.2,Math.sin(a)*r);scene.add(f);let body=new THREE.Mesh(new THREE.SphereGeometry(1,10,7),mat([0x6eacb4,0x8c9eaf,0x3e8e8c,0xc5b15e][i%4]));body.scale.set(1.8,.6,.55);f.add(body);let tail=new THREE.Mesh(new THREE.ConeGeometry(.8,1.5,3),body.material);tail.rotation.z=-Math.PI/2;tail.position.x=-2;f.add(tail);fishShapes.push({f,a,r,s:.4+i%5*.13})}
let x=35,z=25,yaw=0,camYaw=.7,camPitch=.3,inBoat=false,casting=false,castAt=0,catchCount=0,quality=true;const keys={};let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});window.addEventListener('pointerup',()=>dragging=false);window.addEventListener('pointermove',e=>{if(dragging){camYaw-=(e.clientX-lastX)*.006;camPitch=THREE.MathUtils.clamp(camPitch+(e.clientY-lastY)*.004,-.15,.95);lastX=e.clientX;lastY=e.clientY}});window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;keys[e.key.toLowerCase()]=true;if(e.repeat)return;if(e.key.toLowerCase()==='f')cast();if(e.key.toLowerCase()==='b')toggleBoat()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();keys[b.dataset.k]=true};b.onpointerup=()=>keys[b.dataset.k]=false});function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2600)}function cast(){if(casting){casting=false;catchCount++;toast('🐟 Caught a reef fish! Prototype catches: '+catchCount);return}if(inBoat||Math.hypot(x,z)>72){casting=true;castAt=performance.now();toast('🎣 Line cast! Press F again to reel.')}else toast('Walk to the shoreline or enter a boat first!')}function toggleBoat(){if(!inBoat&&Math.hypot(x-90,z-105)>30){toast('Walk to the boat by the end of the pier.');return}inBoat=!inBoat;if(inBoat){x=90;z=105;toast('🚤 Driving boat! WASD to move.')}else toast('Back on foot')};document.getElementById('fish').onclick=cast;document.getElementById('boat').onclick=toggleBoat;document.getElementById('quality').onclick=()=>{quality=!quality;renderer.setPixelRatio(quality?Math.min(devicePixelRatio,1.5):.75);renderer.shadowMap.enabled=quality;toast(quality?'High graphics':'Chromebook performance mode')};
let clock=new THREE.Clock(),time=0;function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.045);time+=dt;const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);let len=Math.hypot(f,side);if(len){const speed=(inBoat?30:keys.shift?19:11)*dt/len;const dx=(Math.sin(camYaw)*f+Math.cos(camYaw)*side)*speed,dz=(Math.cos(camYaw)*f-Math.sin(camYaw)*side)*speed;let nx=x+dx,nz=z+dz;if(inBoat||Math.hypot(nx,nz)<91){x=nx;z=nz}yaw=Math.atan2(dx,dz)}const ground=terrainY(x,z);person.visible=!inBoat;person.position.set(x,ground,z);person.rotation.y=yaw;boatGroup.visible=inBoat||Math.hypot(x-90,z-105)>15;if(inBoat){boatGroup.position.set(x,1,z);boatGroup.rotation.y=yaw}else{boatGroup.position.set(90,1+Math.sin(time*1.4)*.2,105);boatGroup.rotation.y=0}const dist=inBoat?30:23;const target=new THREE.Vector3(x-Math.sin(camYaw)*dist*Math.cos(camPitch),ground+10+dist*Math.sin(camPitch),z-Math.cos(camYaw)*dist*Math.cos(camPitch));camera.position.lerp(target,.095);camera.lookAt(x,ground+4,z);for(let i=0;i<waterPos.count;i++){waterPos.setZ(i,original[i*3+2]+Math.sin(original[i*3]*.034+time*1.3)*.4+Math.cos(original[i*3+1]*.035+time)*.4)}waterPos.needsUpdate=true;water.geometry.computeVertexNormals();for(let q of fishShapes){q.a+=dt*q.s*.15;q.f.position.set(Math.cos(q.a)*q.r,-1.1+Math.sin(time+q.a)*.3,Math.sin(q.a)*q.r);q.f.rotation.y=-q.a}if(casting&&performance.now()-castAt>15000){casting=false;toast('The fish escaped!')}document.getElementById('status').textContent=(inBoat?'🚤 On boat':'🏝 Island explorer')+' · Prototype catches: '+catchCount;renderer.render(scene,camera)}loop();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const token=localStorage.tf_auth||'';async function api(url,method='GET',data){let r=await fetch(url,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},...(data?{body:JSON.stringify(data)}:{})});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function refreshClans(){try{const [all,mine]=await Promise.all([api('/clans'),api('/clans/me')]);document.getElementById('clanstatus').textContent=mine.clan?'Your clan: ['+mine.clan.tag+'] '+mine.clan.name+' ('+mine.clan.members.length+' members)':'You are not in a clan';document.getElementById('clanlist').replaceChildren(...all.clans.map(c=>{let div=document.createElement('div');div.textContent='['+c.tag+'] '+c.name+' — '+c.members+' members';div.style.padding='5px';return div}))}catch(e){document.getElementById('clanstatus').textContent=e.message;try{const all=await api('/clans');document.getElementById('clanlist').textContent=all.clans.map(c=>'['+c.tag+'] '+c.name).join(' · ')}catch{}}}document.getElementById('clans').onclick=()=>{document.getElementById('clan').style.display='block';refreshClans()};document.getElementById('close').onclick=()=>document.getElementById('clan').style.display='none';async function action(a,data={}){try{await api('/clans/action','POST',{action:a,...data});toast('Clan updated');refreshClans()}catch(e){toast(e.message)}}document.getElementById('create').onclick=()=>action('create',{name:document.getElementById('clanname').value,tag:document.getElementById('clantag').value});document.getElementById('join').onclick=()=>action('join',{tag:document.getElementById('jointag').value});document.getElementById('leave').onclick=()=>action('leave');
</script></body></html>
